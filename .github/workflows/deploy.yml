name: Deploy

on:
  push:
    branches: [dev]   # dev 브랜치에 push될 때만 이 workflow가 실행됨

jobs:
  # ---- 1번째 job: CI (테스트) ----
  test:
    runs-on: ubuntu-latest   # GitHub가 제공하는 임시 우분투 서버에서 실행

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        # GitHub 저장소의 코드를 이 임시 서버(Runner) 안으로 받아옴
        # (이게 없으면 Runner 안에 우리 소스코드가 전혀 없는 빈 서버 상태)

      - name: JDK 25 설치
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
        # Gradle로 빌드/테스트하려면 Java가 필요하니 미리 설치

      - name: gradlew 실행 권한 부여
        run: chmod +x backend/gradlew
        # git에서 받은 gradlew 파일은 실행 권한이 없는 경우가 있어서
        # 직접 실행 가능하게 권한을 부여해줌

      - name: 테스트 실행
        run: |
          cd backend
          ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
        # 실제 테스트 코드(src/test)를 실행
        # 여기서 하나라도 실패하면 이 job이 실패로 끝나고,
        # 아래 build-and-deploy job은 절대 실행되지 않음 (안전장치)

  # ---- 2번째 job: CD (빌드 + Docker Hub 업로드 + EC2 배포) ----
  build-and-deploy:
    needs: test
    # needs: test → 위 test job이 성공해야만 이 job이 시작됨
    # 테스트 실패 시 배포 자체가 일어나지 않게 막아주는 핵심 키워드

    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        # Dockerfile, 소스코드, docker-compose.prod.yml이 있어야 하니 다시 받아옴
        # (각 job은 서로 독립된 새 서버에서 실행돼서, test job에서 받은 코드가 여기엔 안 남아있음)

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        # GitHub Secrets에 등록해둔 Docker Hub 계정 정보로 로그인
        # 이 로그인이 있어야 다음 단계에서 이미지를 push(업로드)할 수 있음

      - name: 이미지 빌드 + push
        run: |
          cd backend
          docker build -t artiffect/team5-backend:latest .
          docker push artiffect/team5-backend:latest
        # backend/Dockerfile을 기준으로 이미지를 빌드하고
        # Docker Hub 계정의 team5-backend 저장소로 업로드

      # ---- docker-compose.prod.yml 파일을 EC2로 전송 ----
      - name: docker-compose.prod.yml 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/docker-compose.prod.yml"
          # GitHub Actions Runner 안에 체크아웃되어 있는 이 경로의 파일을 그대로 가져다 씀
          target: "~/app"
          # EC2의 이 경로에 복사함 (폴더 없으면 자동으로 만들어줌)
          strip_components: 1
          # source가 "backend/docker-compose.prod.yml" 인데
          # 이 옵션이 없으면 EC2에 ~/app/backend/docker-compose.prod.yml 로 들어가버림
          # strip_components: 1 → 맨 앞 폴더(backend/) 한 단계를 떼어내고
          # ~/app/docker-compose.prod.yml 로 깔끔하게 위치시킴

      # ---- EC2 접속해서 실제 배포 실행 ----
      - name: EC2에 배포
        uses: appleboy/ssh-action@v1
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          GO_CAMPING_SERVICE_KEY: ${{ secrets.GO_CAMPING_SERVICE_KEY }}
          # secrets.* 값은 워크플로우 문법 안에서만 읽히는 값이라서
          # 이렇게 env: 블록에서 한 번 "진짜 환경변수"로 바꿔줘야
          # 아래 envs: 옵션이 그 값을 찾아서 EC2로 전달할 수 있음
        with:
          host: ${{ secrets.EC2_HOST }}       # 탄력적 IP
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}      # .pem 키 내용 전체
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,TOSS_SECRET_KEY,GO_CAMPING_SERVICE_KEY
          # 위 env: 블록에서 만든 값들을 SSH 세션 안으로 같이 넘겨줌
          script: |
            cd ~/app

            cat > .env << ENV_EOF
            DB_URL=${DB_URL}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
            GO_CAMPING_SERVICE_KEY=${GO_CAMPING_SERVICE_KEY}
            ENV_EOF

            docker pull artiffect/team5-backend:latest
            docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate
            docker image prune -af

            for i in {1..12}; do
              docker compose -f docker-compose.prod.yml exec -T backend curl -f http://localhost:8080/actuator/health && exit 0
              sleep 5
            done
            exit 1