name: CI

on:
  pull_request:
    branches: [dev]   # dev로 들어오는 PR이 생성/업데이트될 때마다 실행

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 25 설치
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x backend/gradlew

      - name: 테스트 실행
        run: |
          cd backend
          ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
        # 이 결과가 PR 화면에 체크 표시(통과/실패)로 나타남
        # 팀원이 머지하기 전에 테스트 통과 여부를 바로 확인할 수 있음