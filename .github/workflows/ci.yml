name: CI

on:
  pull_request:
    branches: [dev]   # dev로 들어오는 PR이 생성/업데이트될 때마다 실행

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # PR에 커버리지 코멘트 달기 위해 필요
      contents: read        # 리포지토리 코드 읽기 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 25 설치
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches      # Gradle 의존성 캐시 경로
            ~/.gradle/wrapper     # Gradle wrapper 캐시 경로
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          # build.gradle 또는 gradle-wrapper.properties 파일이 바뀌면 새 캐시 생성
          # 안 바뀌면 기존 캐시 재사용 → 의존성 다운로드 시간 절약
          restore-keys: |
            ${{ runner.os }}-gradle-
          # 정확한 캐시 못 찾을 때 차선책으로 가장 최근 캐시 사용

      - name: gradlew 실행 권한 부여
        run: chmod +x backend/gradlew

      - name: 테스트 및 커버리지 측정
        run: |
          cd backend
          ./gradlew test --no-daemon
        # --no-daemon: CI 환경에서는 Gradle Daemon이 어차피 재사용 안 되니 사용 안 함
        # build.gradle의 finalizedBy jacocoTestReport 설정으로 테스트 완료 후 자동으로 JaCoCo 리포트 생성
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Checkstyle 실행
        run: |
          cd backend
          ./gradlew checkstyleMain --no-daemon
        # ignoreFailures = true 설정으로 경고만 출력하고 CI는 통과

      - name: PR에 커버리지 코멘트 추가
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN: 별도 발급 없이 GitHub Actions가 자동으로 제공하는 임시 토큰
          # PR에 코멘트를 달 수 있는 권한이 포함됨
          min-coverage-overall: 50       # 전체 커버리지 50% 미만이면 코멘트에 경고 표시
          min-coverage-changed-lines: 60 # 변경된 라인 커버리지 60% 미만이면 경고 표시 (v1.8.0에서 changed-files → changed-lines로 변경됨)
          title: 테스트 커버리지 리포트
          update-comment: true           # 새 커밋 push 시 기존 코멘트 업데이트 (코멘트가 쌓이지 않음)