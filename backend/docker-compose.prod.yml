services:
  backend:
    image: artiffect/team5-backend:latest
    # build: . 이 아니라 image: 를 쓰는 이유
    # → 빌드는 GitHub Actions에서 이미 끝내고 Docker Hub에 올려둠
    # → EC2는 그 완성된 이미지를 받아서 실행만 하면 됨 (소스코드 필요 없음)

    expose:
      - "8080"
      # ports가 아니라 expose를 쓰는 이유
      # → ports: "8080:8080" 이면 외부(인터넷)에서도 8080으로 직접 접근 가능해짐
      # → expose는 "같은 docker-compose 안의 다른 컨테이너만 접근 가능"
      # → 외부에서는 nginx-proxy-manager를 거쳐야만 backend에 도달하게 만드는 것

    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 이 값 때문에 application-prod.yml이 활성화됨

      - CUSTOM_PROD_DB_URL=jdbc:mysql://team5-db.czvbgr7hie3i.ap-northeast-2.rds.amazonaws.com:3306/camping
      - CUSTOM_PROD_DB_USERNAME=admin
      - CUSTOM_PROD_DB_PASSWORD=${DB_PASSWORD}
      - CUSTOM_PROD_JWT_SECRET=${JWT_SECRET}
      - CUSTOM_PROD_TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - CUSTOM_PROD_GO_CAMPING_SERVICE_KEY=${GO_CAMPING_SERVICE_KEY}
      # ${...} 부분은 docker compose가 실행될 때
      # 같은 폴더의 .env 파일에서 값을 읽어와서 채워줌
      # (.env는 EC2 위에서만 생성되고 git에는 없음, 진짜 비밀값이 들어있는 파일)

    restart: unless-stopped
    # EC2가 재부팅되거나 컨테이너가 죽으면 자동으로 다시 시작

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    ports:
      - "80:80"    # 일반 HTTP 트래픽
      - "443:443"  # HTTPS 트래픽
      - "81:81"    # 관리자 설정 화면 (브라우저로 직접 접속해서 프록시 규칙 설정)
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
      # 이 두 볼륨이 없으면, 컨테이너가 재시작될 때마다
      # 81번 화면에서 설정한 내용과 발급받은 SSL 인증서가 다 날아감
      # 볼륨으로 빼두면 컨테이너가 다시 떠도 그대로 유지됨
    restart: unless-stopped

volumes:
  npm_data:
  npm_letsencrypt:
  # 위에서 쓴 볼륨들을 여기서 선언
  # Docker가 이 이름으로 디스크 어딘가에 실제 저장 공간을 만들어줌