spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: "test-secret-key-for-ci-environment-aaaa"
  access-expiration: 1800000
  refresh-expiration: 604800000

toss:
  secret-key: "test-toss-secret-key"

go-camping:
  value:
    serviceKey: "test-service-key"

app:
  cors:
    allowed-origins: http://localhost:3000

cloud:
  aws:
    credentials:
      access-key: test
      secret-key: test
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket
      cloudfront-domain: https://test.cloudfront.net